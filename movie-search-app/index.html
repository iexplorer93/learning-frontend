<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Search App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1, 100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
      <h1 class="header__title">Фильмо<span>поиск</span></h1>
    </header>
    <div class="container">
      <div class="movie-search__wrapper">
        <input type="text" class="movie-search__input" placeholder="Название фильма">
        <button class="movie-search__button">Найти</button>
      </div>
      <ul class="movie-search__list"></ul>
      
    </div>
  <script src="script.js"></script>
</body>
</html>
